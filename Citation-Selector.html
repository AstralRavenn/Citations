<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">

	<style>
		body{
  		font-family: "Noto Serif KR", serif;
		}
		/* div {color: violet;} */
		.quote{font-size: 4rem;}
		.source{font-style: italic; font-size: 2rem;}
		.important{background: pink;}

		.citation{
			margin: 4rem;
			padding: 2rem;
			border: 1px solid violet;
			border-radius: 1rem;
			aspect-ratio: 16/9;
			color: violet;
		}
		#machin{
			color: white;
			background: pink;
		}
	</style>
</head>
<body>

	<div class="citation">
		<div class="quote">"꽃 처럼 피어나"</div>
		<div class="source important">bloom like a flower</div>
	</div>

	<div class="citation" id="machin">
		<div class="quote">"꽃 처럼 피어나"</div>
		<div class="source">Bloom like a flower</div>
	</div>
</body>
</html>
